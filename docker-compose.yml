services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: task_manager
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    depends_on:
      - db
    env_file: ./backend/.env

  frontend:
    build: 
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:8080/api
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db_data: