services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: task_manager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      args:
        _VITE_API_URL: /api
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-dev-only-password}@db:5432/task_manager
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-secret-change-me-0123456789abcdef}
      JWT_COOKIE_SECURE: "False"
      FRONTEND_URL: http://localhost:8080
      TRUSTED_PROXY_HOPS: "0"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MAIL_SEND_API_KEY: ${MAIL_SEND_API_KEY:-}
      MAIL_SEND_EMAIL: ${MAIL_SEND_EMAIL:-}

volumes:
  postgres_data:
