[pytest]
testpaths = tests
pythonpath = .
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
markers =
    unit: pure logic, no database or network
    property: Hypothesis invariants, no database
    integration: services and models against the test MySQL database
    functional: HTTP requests through the Flask test client
    security: access control, rate limits and response headers over HTTP
